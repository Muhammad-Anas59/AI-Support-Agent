<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃</text></svg>">
<meta charset="UTF-8">
<title>Verve Athletics — Admin Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 30% 20%, #1a2540 0%, #0f1729 45%, #0a0f1c 100%);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(245,166,35,0.15) 0%, transparent 70%);
    top: -100px;
    right: -100px;
    border-radius: 50%;
  }
  body::after {
    content: "";
    position: absolute;
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, rgba(99,132,209,0.12) 0%, transparent 70%);
    bottom: -80px;
    left: -80px;
    border-radius: 50%;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 52px 44px;
    width: 380px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
    text-align: center;
    position: relative;
    z-index: 1;
    animation: rise 0.5s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .icon {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, #0f1729, #1a2540);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 24px;
  }
  .logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    color: #0f1729;
  }
  .logo span { color: #f5a623; }
  .subtitle {
    color: #9ca3af;
    font-size: 13px;
    margin-bottom: 36px;
    letter-spacing: 0.3px;
  }
  input {
    width: 100%;
    padding: 13px 16px;
    margin-bottom: 14px;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fafafa;
  }
  input:focus {
    border-color: #0f1729;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(15,23,41,0.06);
  }
  button {
    width: 100%;
    padding: 13px;
    background: #f5a623;
    color: #0f1729;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(245,166,35,0.35);
  }
  button:active { transform: translateY(0); }
  .error {
    color: #dc2626;
    background: #fef2f2;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🏃</div>
    <div class="logo">VERVE<span>ATHLETICS</span></div>
    <div class="subtitle">Admin Console</div>
    <div class="error" id="error">Invalid username or password.</div>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" autocomplete="username" required>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (res.ok) {
        window.location.href = '/';
      } else {
        document.getElementById('error').style.display = 'block';
      }
    });
  </script>
</body>
</html>
